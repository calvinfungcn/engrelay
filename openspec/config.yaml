schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  EngRelay is the MIT-licensed public successor to ai-collaboration; the initial public baseline is 1.7.0 and the current release baseline is 1.9.1.
  Preserve existing installed paths, markers, Skill names, ownership protection, mode selection, review independence and finite owner-authorized continuation.
  Product contracts remain under payload/docs/ai-collaboration; this source repository must not install the package into itself.
  Maintain new requirements/design/tasks here; historical workspaces and independent EngRelay drafts are not active task authorities.
  Do not import private runtime state, backups, old verdicts or source-reference into this repository.
  Use focused verification and disposable fixtures; do not replay broad suites for prose or bookkeeping.
  No runtime orchestration engine, real deployment, global settings change or publication is implied by development setup.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
